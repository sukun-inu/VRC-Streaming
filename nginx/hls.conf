# =============================================================================
#  HLS 配信
# =============================================================================
#  cloudflared がこの listen ポートを向いています。既存トンネルが 80 以外を
#  向いているなら、下の listen 80 をそれに合わせてください。
#
#  キャッシュ制御をここで完結させています。Cloudflare 側のキャッシュルールが
#  未設定でも壊れません (入れても二重に効くだけで害はありません)。
# =============================================================================

server {
    listen 80;
    root /hls;

    # 1秒2リクエスト × 視聴者数。障害調査のときだけ on に。
    access_log off;
    error_log  /dev/stderr warn;

    # --- プレイリスト: 絶対にキャッシュさせない ------------------------------
    #  エッジが数秒前のプレイリストを配ると、その中のセグメントは既に
    #  消えている、という状態になって再生が止まります。
    location ~ \.m3u8$ {
        types { }
        default_type application/vnd.apple.mpegurl;
        add_header Cache-Control     "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        etag off;
    }

    # --- セグメント: 無期限にキャッシュさせる --------------------------------
    #  ファイル名に配信開始時刻が入っていて絶対に使い回されないので immutable が
    #  安全です。視聴者が何人に増えても自宅の上りは 1 本ぶんで済みます。
    location ~ \.ts$ {
        types { }
        default_type video/mp2t;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /healthz { return 200 "ok\n"; }
    location / { return 404; }
}

# =============================================================================
#  猶予セグメントが溜まっているかを目視するためだけの口。
#  ホスト内からのみ到達可能で、トンネルには載っていません。
#    curl -s http://127.0.0.1:8081/live/ | grep -c '\.ts'
#  プレイリストには載らないセグメントなので、m3u8 を見ても分かりません。
# =============================================================================
server {
    listen 127.0.0.1:8081;
    root /hls;
    autoindex on;
    access_log off;
}
