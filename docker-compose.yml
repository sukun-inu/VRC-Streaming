# =============================================================================
#  VRChat HLS 配信スタック  —  単一ファイル完結版
# =============================================================================
#  OBS ─RTMP:1935→ mediamtx(+ffmpeg) ─HLS→ tmpfs ←─ nginx:80
#                                                        ↑
#                                    既存の cloudflared ─┘
#
#  cloudflared はこのスタックに含みません。既存のものをそのまま使います。
#
#  ■ このファイルだけでデプロイが完結します
#     設定は全て configs: content: に埋め込んであり、ホスト側のファイルには
#     一切依存しません。Portainer の Repository でも Web エディタでも、
#     同じように動きます。
#
#     要 Docker Compose 2.23.1 以上 (configs の content 対応)。
#       docker compose version
#
#  ■ 配信キーは「部屋」です
#     固定のパスはありません。OBS 側でストリームキーを自由に決めます
#     (半角英数字・ハイフン・アンダースコア、6〜32文字)。同じキーへの
#     二重 publish は拒否するので、他人に部屋を乗っ取られません。
#     複数のキーを同時にライブにできます (それぞれ独立した配信として並走)。
#     詳しくは README の「配信キーについて」を参照してください。
#
#  ■ 埋め込みスクリプトを編集するときの注意
#     content: の中は Compose の変数展開を通ります。シェルのドル記号は
#     すべて 2 個重ねて書いてください ($$VAR / $$(( )) / $$(date ...))。
#     1 個だけ書くと空文字に置換されて壊れます。
#     このファイル内でドル記号が 1 個で現れてよいのは、下の environment に
#     ある ${MODE:-copy} のような Compose 自身への指定だけです。
#
#  ■ configs の content を変更したら、名前の日付を今日の日付に変えること
#     (例: nginx_conf_20260814 → nginx_conf_20260901。services 側の
#     source: も同じ名前に書き換える。同じ日に2回目の編集をしたら
#     nginx_conf_20260814b のように英字を足して区別する。3回目なら
#     20260814c、のように増やす)
#
#     Docker Compose には既知の制限があり、config の名前を変えずに
#     content だけ変更しても、通常の再デプロイ (docker compose up -d や
#     Portainer の「Update the stack」) ではコンテナが再作成されず、
#     古い内容のまま動き続けることがあります
#     (https://github.com/docker/compose/issues/13045)。
#     名前ごと変えれば Compose が確実に「別物」と認識するので、これが
#     一番安全な回避策です。日付なら「今何番だっけ」と数える必要がなく、
#     いつ触ったかも名前を見るだけで分かります。心当たりのない不具合が
#     直らないときは、まずこの日付を更新し忘れていないかを疑ってください。
#     (どうしても名前を変えたくない場合は `docker compose up -d
#     --force-recreate` で強制的に作り直せます)
#
#  ■ 配信状況ダッシュボード
#     http://<ホストIP>:8082/ で、今どの配信キーが上がっていて、誰が
#     (どのIP・逆引きホスト名で) 見ているかをリアルタイムに一覧できます。
#     自宅LAN内向け (cloudflared のトンネルには乗せていません)。判定方式や
#     制約は vrc-stats サービス (stats.py 冒頭のコメント) 参照。
#
#  ■ 視聴者の実IPについて
#     cloudflared はこのホストへローカル接続で中継してくるだけなので、
#     何もしなければ nginx から見えるアクセス元は全員 cloudflared 自身に
#     なってしまいます。nginx.conf で Cloudflare の CF-Connecting-IP
#     ヘッダーから実際のアクセス元IPを復元しています。nginx 自身は
#     リクエストのたびに同期的な逆引き (DNS PTR) はしません — Apache の
#     HostnameLookups が非推奨とされているのと同じ理由です。逆引き済みで
#     見たい場合は上のダッシュボードを使ってください。
#
#  ■ 注意
#     network_mode: host なので、旧スタックが :80 や :1935 を掴んだままだと
#     起動に失敗します。先に落としてください。
#     RTMP ポート(1935)、配信状況ダッシュボード(8082)は自宅LANの外に
#     公開しないでください (cloudflared のトンネルに含めない)。
# =============================================================================

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

configs:

  mediamtx_yml_20260814c:
    content: |
      # =============================================================================
      #  MediaMTX — RTMP 受け口 + 配信キーごとの HLS 変換
      # =============================================================================
      #  HLS への変換はこのイメージに同梱された ffmpeg を、配信キーが
      #  available になるたびに runOnAvailable で都度起動しています
      #  (on_available.sh)。以前あった別コンテナでの ffprobe ポーリングは
      #  廃止しました。「なぜこの形にしたか」は README 参照。
      #
      #  MediaMTX は未知のキーがあると起動に失敗するので、確実に存在するキーだけ
      #  書いています。ここに無い項目はすべて既定値です。
      #
      #  network_mode: host なので、有効にしたサーバはそのままホストのポートを
      #  掴みます。使わないものを止めておくのは行儀ではなく実害の回避です。
      # =============================================================================

      logLevel: info
      logDestinations: [stdout]

      readTimeout: 10s
      writeTimeout: 10s
      writeQueueSize: 1024

      # 使わないものは全部止める
      metrics: no
      pprof: no
      playback: no
      rtsp: no
      webrtc: no
      srt: no
      hls: no
      moq: no

      # API だけ例外的に有効。vrc-stats サービスが「今どの配信キーが上がって
      # いるか」を GET /v3/paths/list で聞きに行くために使います。
      # apiAddress を 127.0.0.1 に絞っているので、network_mode: host でも
      # ホスト外には出ません (nginx 側の 127.0.0.1:8081 デバッグ用
      # エンドポイントと同じ考え方)。
      api: yes
      apiAddress: 127.0.0.1:9997

      # RTMP のみ。on_available.sh の SRC (rtmp://127.0.0.1:1935/<キー>) と対応。
      rtmp: yes
      rtmpAddress: :1935
      rtmpEncryption: "no"

      paths:
        # 配信キーは OBS 側で自由に決められます。固定のパスはありません。
        # 許可するのは半角英数字・ハイフン・アンダースコアのみ、6〜32文字。
        # これに一致しない配信キーは MediaMTX がそもそも受け付けません。
        # runOnAvailable にすら渡らないので、パスの組み立てに危険な文字が
        # 混ざる心配がありません (on_available.sh 側でも念のため再検査します)。
        #
        # 外部公開する可能性があるなら、長く推測されにくいキーにしてください
        # (この文字種・桁数のままだと総当たりに強いとは言えません)。
        '~^[A-Za-z0-9_-]{6,32}$':
          source: publisher

          # 同じキーへの二重 publish を拒否します。「部屋」を他人に
          # 割り込まれないための設定なので yes にはしません。
          # 副作用: 本人の OBS が瞬断して再接続する場合も、readTimeout(10s) が
          # 経過して旧セッションが死んだと判定されるまで再接続できません。
          overridePublisher: no

          # このキーが有効になるたびに、このキー専用の ffmpeg 変換を1本
          # 起動します。配信が終わる (unavailable になる) と MediaMTX が
          # このプロセスに SIGINT を送って止めます。
          runOnAvailable: /bin/sh /opt/on_available.sh

  nginx_conf_20260814k:
    content: |
      # =============================================================================
      #  HLS 配信
      # =============================================================================
      #  cloudflared がこの listen ポートを向いています。既存トンネルが 80 以外を
      #  向いているなら、下の listen 80 をそれに合わせてください。
      #
      #  キャッシュ制御をここで完結させています。Cloudflare 側のキャッシュルールが
      #  未設定でも壊れません (入れても二重に効くだけで害はありません)。
      #
      #  URL は配信キーごとに /<キー>/index.m3u8 です。固定パスの /live/ は
      #  もうありません。ルート(/) はキーから再生URLを組み立てる案内ページです。
      #
      #  拡張子なしの短縮URL (/<キー>) は一度試しましたが廃止しました。
      #  PC (Windows Media Foundation) では動いたものの、Quest 側の
      #  プレイヤーが拡張子なしのURLをHLSとして認識できず再生できません
      #  でした。プラットフォーム間で挙動が変わるURLは、動く/動かないが
      #  静かに分かれる罠になるので、全プラットフォームで確実に動く
      #  /<キー>/index.m3u8 だけに統一しています。
      # =============================================================================

      # 配信状況ダッシュボード (vrc-stats) へ視聴状況を伝えるための最小フォーマット。
      # HLSLOG| で始まる行だけを stats 側で拾うので、他のログ行と混ざっても
      # 誤検出しません。$$remote_addr は下の real_ip 設定 (server ブロック内)
      # で置き換わった後の値、つまり cloudflared 経由でも視聴者の実IPです。
      log_format hlslog 'HLSLOG|$$time_iso8601|$$remote_addr|$$uri|$$status';

      server {
          listen 80;
          root /hls;

          # cloudflared はこのホストへローカル接続で中継してくるだけなので、
          # 何もしなければ $$remote_addr は視聴者のIPではなく cloudflared 自身
          # (127.0.0.1) になってしまいます。Cloudflare はエッジで
          # CF-Connecting-IP ヘッダーに本来の接続元IPを入れて転送してくる
          # ので、ループバックからの接続に限ってそれを信用して $$remote_addr を
          # 復元します (LAN内の他端末がこのヘッダーを偽装しても、ループバック
          # からの接続でなければ無視されるので効きません)。
          set_real_ip_from 127.0.0.1;
          set_real_ip_from ::1;
          real_ip_header CF-Connecting-IP;
          real_ip_recursive off;

          # 視聴者数 × 1秒2リクエスト程度のペースでログが出ます。下の
          # vrc-stats サービスが視聴者一覧を作るのに使うので常時 on に
          # しています。生ログは docker compose logs nginx でも見られます
          # (ただし逆引き済みホスト名までは出ません。nginx はリクエストの
          # たびに同期的にDNS逆引きをするような真似はしません — Apache の
          # HostnameLookups が非推奨とされているのと同じ理由で、リクエスト
          # 経路上での同期DNSはパフォーマンス上の実害があるからです。
          # 逆引き済みで見たいときは配信状況ダッシュボードを使ってください)。
          access_log /dev/stdout hlslog;
          access_log syslog:server=127.0.0.1:19514,tag=hls,nohostname hlslog;
          error_log  /dev/stderr warn;

          # --- 案内ページ: 配信キーを入れると再生URLを組み立てる -------------------
          #  マウント先は /usr/share/nginx/html (イメージに元から存在する docroot)。
          #  存在しないディレクトリ (例: /etc/nginx/html) を新規にマウント対象にすると、
          #  Docker がファイルの代わりにディレクトリを作ってしまうことがあり、
          #  alias がそのディレクトリを指して nginx が 500 (EISDIR) を返すことがあります。
          #
          #  alias はここでは使いません。alias + 「URIが / で終わる location」
          #  は index ディレクティブとの組み合わせが罠だらけです:
          #    - alias にファイル名まで書く (alias .../index.html) と、index
          #      ディレクティブの値がそのまま後ろへ文字列連結されて
          #      index.htmlindex.html のような壊れたパスになり 500。
          #    - alias をディレクトリ (末尾 /) にして index 解決に任せると、
          #      index モジュールは内部的に「URI + index ファイル名」
          #      (この場合 /index.html) へ作り直してから location の
          #      マッチングをやり直します。/index.html にマッチする
          #      location を用意していないと、他の location (ここでは
          #      catch-all の location /) に拾われます。この catch-all は
          #      404 ではなく / へ302リダイレクトするので、/ 自体が同じ
          #      理由で壊れていれば、そのままリダイレクトループになります。
          #  root + try_files ならどちらの罠も踏みません。try_files は
          #  location の外に出ずに指定したファイルを直接開くだけです。
          location = / {
              default_type text/html;
              root /usr/share/nginx/html;
              try_files /index.html =404;
          }

          # --- プレイリスト: 絶対にキャッシュさせない ------------------------------
          #  エッジが数秒前のプレイリストを配ると、その中のセグメントは既に
          #  消えている、という状態になって再生が止まります。
          #
          #  s-maxage=0 と stale-if-error=0 が要です。max-age/no-store だけだと、
          #  「オリジンに一瞬でも到達できなかった時にキャッシュ済みの古い応答を
          #  返す」(stale-if-error, Cloudflare の Always Online 相当) までは
          #  防げません。視聴開始直後に古いプレイリストを掴んで即座に取得エラーに
          #  なる、という症状はこれが原因のことが多いです。
          location ~ \.m3u8$$ {
              types { }
              default_type application/vnd.apple.mpegurl;
              add_header Cache-Control     "no-store, no-cache, must-revalidate, max-age=0, s-maxage=0, stale-while-revalidate=0, stale-if-error=0" always;
              add_header CDN-Cache-Control "no-store" always;
              add_header Pragma "no-cache" always;
              add_header Access-Control-Allow-Origin "*" always;
              etag off;
          }

          # --- セグメント: 無期限にキャッシュさせる --------------------------------
          #  ファイル名に配信開始時刻が入っていて絶対に使い回されないので immutable が
          #  安全です。視聴者が何人に増えても自宅の上りは 1 本ぶんで済みます。
          location ~ \.ts$$ {
              types { }
              default_type video/mp2t;
              add_header Cache-Control "public, max-age=31536000, immutable" always;
              add_header Access-Control-Allow-Origin "*" always;
          }

          # --- 遅延測定用のミリ秒時計 ------------------------------------------------
          #  OBS のシーンにブラウザソースとしてこの URL を追加すると、配信映像に
          #  ミリ秒表示の時計が焼き込まれます。PC と Quest で同時に再生し、
          #  両方の画面を1枚の写真に収めれば、映っている時計の差がそのまま
          #  「両者の遅延差」になります。README の「遅延は既に下限」参照。
          #  exact match なので、たとえ配信キー(6〜32文字)と同名になり得ても
          #  (例: "healthz" は7文字なので配信キーとして使用可)、
          #  exact match は regex より必ず先に評価されるため奪われません。
          #  ("clock" 自体は5文字しかなく、配信キーの最小文字数(6文字)に
          #   届かないため、そもそも配信キーにはなり得ません)
          location = /clock {
              default_type text/html;
              root /usr/share/nginx/html;
              try_files /clock.html =404;
          }

          location = /healthz { return 200 "ok\n"; }

          # --- それ以外: 404 を出さず案内ページへ誘導 ------------------------------
          #  .m3u8 / .ts / /clock / /healthz のどれにも一致しない未知のパスは
          #  ここに落ちます (この location は最長一致の prefix "/" なので、
          #  上の regex location に一致しなかったものだけがここに来ます)。
          #  素の 404 を返す代わりに / (配信キー入力の案内ページ) へ302
          #  リダイレクトします。301 にしないのは、ブラウザに恒久キャッシュ
          #  させたくないからです (将来そのパスに意味を持たせる可能性を
          #  潰さないため)。
          location / { return 302 /; }
      }

      # =============================================================================
      #  猶予セグメントが溜まっているかを目視するためだけの口。
      #  ホスト内からのみ到達可能で、トンネルには載っていません。
      #    curl -s http://127.0.0.1:8081/<キー>/ | grep -c '\.ts'
      #  プレイリストには載らないセグメントなので、m3u8 を見ても分かりません。
      #  autoindex が有効なので、curl -s http://127.0.0.1:8081/ で今ライブ中の
      #  キー名が一覧できます。ローカルからしか届かないので許容しています。
      # =============================================================================
      server {
          listen 127.0.0.1:8081;
          root /hls;
          autoindex on;
          access_log off;
      }

  clock_html_20260814:
    content: |
      <!doctype html>
      <html lang="ja">
      <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>遅延測定用クロック</title>
      <style>
        html, body {
          margin: 0; padding: 0; width: 100%; height: 100%;
          background: #000; overflow: hidden;
        }
        .clock {
          position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
          font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
          font-size: min(14vw, 18vh);
          font-weight: 700;
          color: #fff;
          letter-spacing: 0.02em;
          white-space: nowrap;
        }
        .hint {
          position: fixed; left: 12px; bottom: 8px;
          font-family: -apple-system, "Segoe UI", sans-serif;
          font-size: 12px; color: #555;
        }
      </style>
      </head>
      <body>
        <div class="clock" id="clock">--:--:--.---</div>
        <div class="hint">OBS のシーンにブラウザソースとして追加 → PC/Questで同時再生 → 両画面を1枚の写真に収めて時計の差を見る</div>
      <script>
        var el = document.getElementById('clock');
        function pad(n, len) { n = String(n); while (n.length < len) n = '0' + n; return n; }
        function tick() {
          var d = new Date();
          el.textContent = pad(d.getHours(), 2) + ':' + pad(d.getMinutes(), 2) + ':' +
                            pad(d.getSeconds(), 2) + '.' + pad(d.getMilliseconds(), 3);
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      </script>
      </body>
      </html>

  landing_html_20260814c:
    content: |
      <!doctype html>
      <html lang="ja">
      <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>配信ルーム</title>
      <style>
        :root {
          color-scheme: light dark;
          --bg: #0b0d10; --fg: #e8e8ea; --sub: #9aa0a6;
          --card: #16191d; --accent: #5b8def; --border: #262b31; --warn: #e2a33d;
        }
        @media (prefers-color-scheme: light) {
          :root { --bg:#f6f7f9; --fg:#1b1d21; --sub:#5a606a; --card:#fff; --border:#e2e5e9; --warn:#8a5a00; }
        }
        * { box-sizing: border-box; }
        body {
          margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
          background: var(--bg); color: var(--fg);
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
          padding: 24px;
        }
        .card {
          width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border);
          border-radius: 16px; padding: 28px;
        }
        h1 { font-size: 18px; margin: 0 0 6px; }
        p.desc { color: var(--sub); font-size: 13px; margin: 0 0 20px; line-height: 1.6; }
        label { display:block; font-size: 12px; color: var(--sub); margin-bottom: 6px; }
        input {
          width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
          background: transparent; color: var(--fg); font-size: 15px; font-family: ui-monospace, monospace;
        }
        input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
        button {
          margin-top: 14px; width: 100%; padding: 12px; border-radius: 10px; border: none;
          background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
        }
        button:active { opacity: .85; }
        .format-hint { margin-top: 8px; font-size: 11px; color: var(--sub); }
        .warn { margin-top: 8px; font-size: 12px; color: var(--warn); display: none; }
        .warn.show { display: block; }
        .result { margin-top: 18px; display: none; }
        .result.show { display: block; }
        .url-box {
          display:flex; gap:8px; align-items:center; background: var(--bg); border: 1px solid var(--border);
          border-radius: 10px; padding: 10px 12px;
        }
        .url-box code { flex:1; font-size: 12px; word-break: break-all; }
        .url-box button { margin:0; width:auto; padding:8px 12px; font-size:12px; background: var(--border); color: var(--fg); }
        .hint { margin-top:10px; font-size:12px; color: var(--sub); line-height:1.6; }
      </style>
      </head>
      <body>
        <div class="card">
          <h1>配信ルーム</h1>
          <p class="desc">配信キーを入力すると、VRChat の動画URL欄に貼り付ける再生URLを作成します。</p>
          <label for="key">配信キー</label>
          <input id="key" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="例: my-room-key">
          <p class="format-hint">半角英数字・ハイフン・アンダースコア、6〜32文字</p>
          <p class="warn" id="warn">この形式では配信キーとして受け付けられません（サーバ側の設定と一致していません）。</p>
          <button id="go">URLを作成</button>
          <div class="result" id="result">
            <div class="url-box">
              <code id="url"></code>
              <button id="copy">コピー</button>
            </div>
            <p class="hint">VRChat のワールドの動画URL欄にこのURLを貼り付けてください。配信中でない場合は再生できません。</p>
          </div>
        </div>
      <script>
      (function () {
        var input = document.getElementById('key');
        var go = document.getElementById('go');
        var warnEl = document.getElementById('warn');
        var result = document.getElementById('result');
        var urlEl = document.getElementById('url');
        var copyBtn = document.getElementById('copy');
        var KEY_RE = /^[A-Za-z0-9_-]{6,32}$/;

        function build() {
          var key = input.value.trim();
          if (!key) { input.focus(); return; }
          warnEl.className = KEY_RE.test(key) ? 'warn' : 'warn show';
          var url = location.origin + '/' + encodeURIComponent(key) + '/index.m3u8';
          urlEl.textContent = url;
          result.className = 'result show';
          copyBtn.textContent = 'コピー';
        }

        go.addEventListener('click', build);
        input.addEventListener('keydown', function (e) { if (e.key === 'Enter') build(); });

        copyBtn.addEventListener('click', function () {
          var text = urlEl.textContent;
          if (!text) return;
          var done = function () { copyBtn.textContent = 'コピーしました'; setTimeout(function () { copyBtn.textContent = 'コピー'; }, 1500); };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
          } else {
            fallbackCopy(text, done);
          }
        });

        function fallbackCopy(text, done) {
          var ta = document.createElement('textarea');
          ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.focus(); ta.select();
          try { document.execCommand('copy'); } catch (e) {}
          document.body.removeChild(ta);
          done();
        }
      })();
      </script>
      </body>
      </html>

  on_available_sh_20260814c:
    content: |
      #!/bin/sh
      # =============================================================================
      #  1配信キー分の RTMP -> HLS 変換
      # =============================================================================
      #  MediaMTX の runOnAvailable から、配信キーごとに毎回このスクリプトが
      #  1本ずつ起動されます。呼ばれた時点で publisher は既に存在するので、
      #  「待つ」処理はここにはありません (それは MediaMTX 側の仕事です)。
      #
      #  配信が終わる (unavailable になる) と MediaMTX がこのプロセスに SIGINT を
      #  送ってきます。ffmpeg が自分で落ちた場合も含め、どちらの終わり方でも
      #  trap で後片付けして終了します。「待機に戻ってループ」はしません。
      #  次にこのキーで配信が始まれば、MediaMTX がまた新しくこのスクリプトを
      #  起動します。
      #
      #  外部コマンドは ffmpeg / ffprobe / find / grep / date のみ。計算はすべて
      #  シェルの整数演算で済ませてあり awk にも依存しません。
      # =============================================================================
      set -u

      # --- 配線 ---------------------------------------------------------------
      KEY="$${MTX_PATH:-}"

      # 多重防御。mediamtx.yml の path 正規表現で既に絞ってあるが、
      # OUT_DIR の組み立てに使う値なので、ここでも念のため検査する。
      case "$$KEY" in
        '') echo "FATAL: MTX_PATH が空です" >&2; exit 1 ;;
        *[!A-Za-z0-9_-]*) echo "FATAL: MTX_PATH に不正な文字: $$KEY" >&2; exit 1 ;;
      esac

      SRC="rtmp://127.0.0.1:1935/$${KEY}"
      OUT_DIR="/hls/$${KEY}"
      PLAYLIST="$${OUT_DIR}/index.m3u8"

      # --- 運用ノブ (compose の environment から渡る。mediamtx サービス側) ------
      MODE="$${MODE:-copy}"
      SEG="$${SEG_SECONDS:-1}"
      LIST="$${SEG_LIST_SIZE:-8}"
      KEEP="$${SEG_KEEP_EXTRA:-60}"
      GOP_CHECK="$${GOP_CHECK_SECONDS:-4}"

      FFPID=""

      log()  { echo "[$$(date -u '+%H:%M:%S')] [$${KEY}] $$*"; }
      warn() { echo "[$$(date -u '+%H:%M:%S')] [$${KEY}] !! $$*"; }

      # 数値かどうか。これを通さずに $$(( )) へ渡すと、想定外の入力でシェルごと落ちます。
      is_num() { case "$${1:-}" in ''|*[!0-9]*) return 1 ;; *) return 0 ;; esac; }

      for c in ffmpeg ffprobe; do
        command -v "$$c" >/dev/null || { echo "FATAL: $${c} が見つかりません" >&2; exit 1; }
      done

      # 前回このキーで異常終了した残骸があれば消してから作り直す。
      rm -rf "$$OUT_DIR" 2>/dev/null
      mkdir -p "$$OUT_DIR"

      # MediaMTX から SIGINT/TERM が来たら、ffmpeg を止めて出力ごと消して終わる。
      trap '[ -n "$$FFPID" ] && kill "$$FFPID" 2>/dev/null; [ -n "$$FFPID" ] && wait "$$FFPID" 2>/dev/null; rm -rf "$$OUT_DIR"; exit 0' TERM INT

      log "publisher available mode=$${MODE} segment=$${SEG}s window=$$(( SEG * LIST ))s grace=$$(( SEG * KEEP ))s latency~$$(( SEG * 3 + 2 ))s"

      # ---------------------------------------------------------------------------
      # 1) 入力の検査
      #    copy は OBS の出力をそのまま流すので、ここで見ておかないと
      #    「サーバは正常なのに VRChat だけ再生できない」になります。
      # ---------------------------------------------------------------------------
      V=$$(ffprobe -v error -select_streams v:0 -analyzeduration 2000000 -probesize 2000000 \
            -show_entries stream=codec_name,profile,width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 "$$SRC" 2>/dev/null)
      if [ -z "$$V" ]; then
        warn "ffprobe が入力を読めませんでした。中断します"
        rm -rf "$$OUT_DIR"
        exit 1
      fi

      A=$$(ffprobe -v error -select_streams a:0 -analyzeduration 2000000 -probesize 2000000 \
            -show_entries stream=codec_name,sample_rate,channels \
            -of default=noprint_wrappers=1 "$$SRC" 2>/dev/null)

      # key=value (1行1項目) で受け取り、キー名で拾う。位置(何列目か)には
      # 依存しない。-show_entries に書いた順序どおりに ffprobe が出力する
      # とは限らず、実際に r_frame_rate と pix_fmt の出力順が入れ替わって
      # 列がズレることを確認しています。CSVで位置決め打ちすると、こういう
      # ズレがそのまま誤った値の割り当てになり、しかもエラーにならず
      # 静かに間違った警告 (今回なら「pix_fmt が 24/1」) を出すだけなので
      # 気づきにくいです。
      VCODEC=""; VPROF=""; VW=""; VH=""; VRATE=""; VPIX=""
      while IFS='=' read -r k v; do
        case "$$k" in
          codec_name)   VCODEC="$$v" ;;
          profile)      VPROF="$$v" ;;
          width)        VW="$$v" ;;
          height)       VH="$$v" ;;
          r_frame_rate) VRATE="$$v" ;;
          pix_fmt)      VPIX="$$v" ;;
        esac
      done <<EOF
      $$V
      EOF

      # r_frame_rate は "30/1" や "30000/1001" の形。四捨五入して整数 fps にする。
      FPS=0
      RNUM="$${VRATE%%/*}"; RDEN="$${VRATE##*/}"
      if is_num "$$RNUM" && is_num "$$RDEN" && [ "$$RDEN" -gt 0 ]; then
        FPS=$$(( (RNUM + RDEN / 2) / RDEN ))
      fi

      ACODEC=""; ARATE=""; ACH=""
      if [ -n "$$A" ]; then
        while IFS='=' read -r k v; do
          case "$$k" in
            codec_name)  ACODEC="$$v" ;;
            sample_rate) ARATE="$$v" ;;
            channels)    ACH="$$v" ;;
          esac
        done <<EOF
      $$A
      EOF
      fi

      if [ -n "$$ACODEC" ]; then
        log "input: $${VCODEC} $${VPROF} $${VW}x$${VH} $${FPS}fps $${VPIX} / $${ACODEC} $${ARATE}Hz $${ACH}ch"
      else
        log "input: $${VCODEC} $${VPROF} $${VW}x$${VH} $${FPS}fps $${VPIX} / 音声なし"
      fi

      if [ "$$MODE" = "copy" ]; then
        if [ "$$VCODEC" = "h264" ]; then
          case "$$VPROF" in
            Baseline|"Constrained Baseline"|Main|High) ;;
            *) warn "H.264 プロファイル $${VPROF} は Quest で再生できない可能性が高い" ;;
          esac
        else
          warn "映像が $${VCODEC}。VRChat は H.264 のみ。OBS を直すか MODE=transcode に"
        fi
        [ "$$VPIX" = "yuv420p" ] || warn "pix_fmt が $${VPIX}。Quest は yuv420p しか再生できません"
        [ -n "$$ACODEC" ] && [ "$$ACODEC" != "aac" ] && warn "音声が $${ACODEC}。VRChat は AAC のみ"
        is_num "$$VW" && [ "$$VW" -gt 1920 ] && warn "横 $${VW}px。Quest 向けには 1920 以下を推奨"
        is_num "$$VH" && [ "$$VH" -gt 1080 ] && warn "縦 $${VH}px。Quest 向けには 1080 以下を推奨"
        is_num "$$VH" && [ "$$FPS" -gt 30 ] && [ "$$VH" -gt 720 ] &&
          warn "$${VW}x$${VH}@$${FPS} は Quest だと描画とデコーダが競合しやすい"
      fi

      # ---------------------------------------------------------------------------
      # 2) キーフレーム間隔の実測 (copy 運用での最重要項目)
      #    OBS のキーフレーム間隔が SEG_SECONDS と違うと、ffmpeg は指定どおりに
      #    切れず OBS 側の間隔で切ります。遅延がそのぶん伸びます。
      #    「なぜか遅延が想定の倍」はほぼこれです。
      #
      #    小数を扱わずに済むよう、すべて 1/10 秒単位の整数で計算しています。
      # ---------------------------------------------------------------------------
      if is_num "$$GOP_CHECK" && [ "$$GOP_CHECK" -gt 0 ]; then
        KF=$$(ffprobe -v error -select_streams v:0 -read_intervals "%+$${GOP_CHECK}" \
               -show_entries frame=key_frame -of csv=p=0 "$$SRC" 2>/dev/null | grep -c '^1')
        if is_num "$$KF" && [ "$$KF" -gt 0 ]; then
          EST10=$$(( GOP_CHECK * 10 / KF ))          # 例: 4秒に2枚 -> 20 (=2.0秒)
          log "keyframe interval: 約 $$(( EST10 / 10 )).$$(( EST10 % 10 ))s"
          # 許容 ±30%。EST10 は10倍値なので閾値も10倍で比較する。
          if [ "$$EST10" -gt $$(( SEG * 13 )) ] || [ "$$EST10" -lt $$(( SEG * 7 )) ]; then
            warn "キーフレーム間隔が SEG_SECONDS=$${SEG}s と一致していません"
            warn "  OBS の「キーフレーム間隔」を $${SEG} 秒にしてください"
            warn "  このままだと遅延が約 $$(( EST10 * 3 / 10 + 2 ))s になります"
          fi
        fi
      fi

      # ---------------------------------------------------------------------------
      # 3) コーデック指定
      # ---------------------------------------------------------------------------
      if [ "$$MODE" = "copy" ]; then
        VOPT="-c:v copy"
        AENC="-c:a copy"
      else
        # 切り分け用の固定プロファイル。ここは環境変数で変えられません。
        # 「既知の正常値」であることが唯一の存在価値なので、可変にすると
        # 切り分けの道具として機能しなくなります。
        VOPT="-vf scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2
              -c:v libx264 -preset veryfast -profile:v main -level:v 4.0 -pix_fmt yuv420p
              -b:v 3500k -maxrate 3500k -bufsize 7000k
              -r 30 -g $$(( 30 * SEG )) -keyint_min $$(( 30 * SEG )) -sc_threshold 0 -bf 0"
        AENC="-c:a aac -b:a 128k -ar 48000 -ac 2"
      fi

      # 音声トラックが無い入力にも無音 AAC を必ず載せます。
      # 音声なしの HLS は AVPro が読み込みに失敗することがあります。
      if [ -n "$$ACODEC" ]; then
        SILENCE=""
        MAPS="-map 0:v:0 -map 0:a:0"
        AOPT="$$AENC"
      else
        SILENCE="-f lavfi -i anullsrc=channel_layout=stereo:sample_rate=48000"
        MAPS="-map 0:v:0 -map 1:a:0"
        AOPT="-c:a aac -b:a 128k -ar 48000 -ac 2 -shortest"
      fi

      # ---------------------------------------------------------------------------
      # 4) HLS 出力
      #
      #   hls_delete_threshold がこのスタックの要です。
      #   プレイリストから外した後もディスクに残す本数で、既定は 1。
      #   ここに残ったセグメントはプレイリストに現れないので遅延に影響せず、
      #   取得が遅れたクライアントが 404 を踏まなくなるだけです。
      #
      #   temp_file : .tmp に書いてから rename。書きかけを nginx が配る事故を防ぐ。
      #   master playlist は作りません (単一レンディションなので不要)。
      #
      #   hls_base_url が要ります。ffmpeg は既定だとセグメントをファイル名
      #   だけの相対参照 (例: 20260814_000038.ts) で書きます。プレイヤーは
      #   これを「プレイリスト自身のURL」基準で解決するので、案内ページの
      #   短縮URL (/<キー>、末尾スラッシュなし) でプレイリストを取得すると
      #   末尾の "<キー>" がファイル名扱いされて消え、/<キー>/xxx.ts では
      #   なく /xxx.ts を探しにいって 404 になります (実際にこの事故が
      #   起きました)。hls_base_url でセグメント参照を /<キー>/xxx.ts と
      #   ルート相対の絶対パスにしてしまえば、プレイリストをどの末尾の
      #   URLで取得しても解決がぶれません。
      # ---------------------------------------------------------------------------
      RUN="$$(date -u +%Y%m%d%H%M%S)"
      log "starting ffmpeg (run=$${RUN})"

      # shellcheck disable=SC2086
      ffmpeg -hide_banner -loglevel warning -nostdin \
        -fflags nobuffer -analyzeduration 2000000 -probesize 2000000 \
        -i "$$SRC" $$SILENCE \
        $$MAPS $$VOPT $$AOPT \
        -f hls \
        -hls_time "$$SEG" \
        -hls_list_size "$$LIST" \
        -hls_delete_threshold "$$KEEP" \
        -hls_flags delete_segments+omit_endlist+temp_file \
        -hls_segment_type mpegts \
        -hls_base_url "/$${KEY}/" \
        -hls_segment_filename "$${OUT_DIR}/$${RUN}_%06d.ts" \
        "$$PLAYLIST" &

      FFPID=$$!
      wait "$$FFPID"
      FFPID=""

      rm -rf "$$OUT_DIR"
      log "ffmpeg exited"

  stats_py_20260814:
    content: |
      #!/usr/bin/env python3
      # =============================================================================
      #  配信状況ダッシュボード (vrc-stats)
      # =============================================================================
      #  「今どの配信キーが上がっているか」は mediamtx の API (127.0.0.1:9997) に
      #  聞きに行きます。「誰が見ているか」は mediamtx では分かりません
      #  (このスタックの HLS は mediamtx ではなく nginx が tmpfs から直接配っている
      #  ので、mediamtx からは見えない)。そこで nginx 側のアクセスログを syslog
      #  (UDP, 127.0.0.1:19514) でこのプロセスへ直接送ってもらい、そこから拾います。
      #  nginx.conf 側の access_log syslog:server=127.0.0.1:19514 と対になっている
      #  ので、ポート番号を変えるなら両方直してください。19514 という半端な数字は、
      #  自宅サーバで既に rsyslog 等が使っていがちな 514/1514/5514 のような
      #  切りの良いポートとの衝突を避けるためです。
      #
      #  「視聴中」の判定はタイムアウト方式です。HLS はプレイヤーが定期的に
      #  プレイリスト/セグメントを取りに来続けるだけで、明示的な「切断」通知が
      #  無いので、直近 VIEWER_TIMEOUT_SECONDS 秒アクセスが無いIPは
      #  「見なくなった」とみなして一覧から消します。配信自体が終わると
      #  on_available.sh がそのキーのHLS出力を即座に消すので、視聴者側は
      #  すぐ404を踏むようになり (404は「視聴中」に数えません)、この
      #  タイムアウト時間だけ遅れて一覧から消えます。
      #
      #  状態はすべてメモリ上だけに持っていて、どこにも永続化しません。
      #  このプロセスを再起動すれば一覧は空から再スタートします
      #  (「配信が生きている間だけ分かればいい」という用途なので、これで十分)。
      # =============================================================================

      import http.server
      import json
      import os
      import re
      import secrets
      import socket
      import sys
      import threading
      import time
      import urllib.error
      import urllib.request
      from concurrent.futures import ThreadPoolExecutor

      # alpine (musl) はロケール未設定だと標準出力が ascii にフォールバックすることがあり、
      # 日本語ログを print() した瞬間に UnicodeEncodeError で落ちます。compose 側の
      # PYTHONUTF8=1 で通常は防げますが、手動で `python3 stats.py` された場合の保険として
      # ここでも明示的に UTF-8 化しておきます。
      for _stream in (sys.stdout, sys.stderr):
          if hasattr(_stream, "reconfigure"):
              _stream.reconfigure(encoding="utf-8", errors="replace")

      # --- 設定 --------------------------------------------------------------------
      HTTP_PORT = int(os.environ.get("STATS_PORT", "8082"))
      VIEWER_TIMEOUT = int(os.environ.get("VIEWER_TIMEOUT_SECONDS", "8"))

      # 以下2つは compose の他のサービスと直結した内部配線なので環境変数化していません。
      # 変えるなら nginx.conf / mediamtx.yml 側もあわせて直してください。
      MEDIAMTX_API = "http://127.0.0.1:9997"
      SYSLOG_BIND = ("127.0.0.1", 19514)

      POLL_INTERVAL = 2       # mediamtx APIを見に行く間隔 (秒)
      STREAM_STALE_AFTER = POLL_INTERVAL * 4  # この間 mediamtx 側で観測できなければ配信一覧から消す
      DNS_OK_TTL = 600         # 逆引き成功時のキャッシュ有効期限 (秒)
      DNS_NG_TTL = 60          # 逆引き失敗 (PTR無し等) 時のキャッシュ有効期限。短めにして再試行を許す。
      DNS_WORKERS = 6          # 同時に投げる逆引きの最大本数

      # 配信キーの形式は mediamtx.yml の paths 正規表現と揃えています。
      KEY_RE = re.compile(r"^/([A-Za-z0-9_-]{6,32})/")

      # --- 共有状態 ------------------------------------------------------------------
      # 複数スレッド (syslog受信 / mediamtx ポーリング / 掃除 / HTTPハンドラ) から
      # 触るので、全部このロック1本の下で読み書きします。データ量も更新頻度も
      # 小さい個人利用規模なので、ロックの粒度を細かくする実益はありません。
      _lock = threading.Lock()
      _viewers = {}    # key -> { ip -> {"first_seen": epoch, "last_seen": epoch} }
      _streams = {}    # key -> {"online_since": str|None, "seen_at": epoch}
      _dns_cache = {}  # ip -> {"hostname": str|None, "expiry": epoch}
      _dns_inflight = set()
      _dns_pool = ThreadPoolExecutor(max_workers=DNS_WORKERS, thread_name_prefix="rdns")


      def now():
          return time.time()


      def log(msg):
          print("[stats] " + msg, flush=True)


      # --- 逆引き --------------------------------------------------------------------
      def resolve_hostname(ip):
          # socket.gethostbyaddr にはタイムアウトを個別指定できません。OSのリゾルバが
          # ハングすると、このワーカースレッドはそのぶん長く塞がれますが、結果は
          # キャッシュ経由で非同期に反映されるだけなので、ダッシュボードのHTTP応答
          # 自体が遅れることはありません (悪くてもワーカー本数ぶんの解決が滞るだけ)。
          try:
              hostname, _aliases, _addrs = socket.gethostbyaddr(ip)
          except (socket.herror, socket.gaierror, OSError):
              hostname = None
          with _lock:
              ttl = DNS_OK_TTL if hostname else DNS_NG_TTL
              _dns_cache[ip] = {"hostname": hostname, "expiry": now() + ttl}
              _dns_inflight.discard(ip)


      def ensure_resolving(ip):
          with _lock:
              cached = _dns_cache.get(ip)
              fresh = cached is not None and cached["expiry"] > now()
              if fresh or ip in _dns_inflight:
                  return
              _dns_inflight.add(ip)
          _dns_pool.submit(resolve_hostname, ip)


      # --- nginx からのアクセスログ受信 (syslog UDP) ---------------------------------
      def syslog_listener():
          sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          sock.bind(SYSLOG_BIND)
          log("syslog listener on {}:{}".format(*SYSLOG_BIND))
          marker = "HLSLOG|"
          while True:
              try:
                  data, _addr = sock.recvfrom(65535)
              except OSError:
                  continue
              line = data.decode("utf-8", "replace")
              idx = line.find(marker)
              if idx < 0:
                  continue
              fields = line[idx + len(marker):].strip().split("|")
              if len(fields) != 4:
                  continue
              _ts, ip, uri, status = fields
              if not status.startswith("2"):
                  continue  # 404等は「視聴中」に数えない
              m = KEY_RE.match(uri)
              if not m:
                  continue
              key = m.group(1)
              t = now()
              with _lock:
                  viewers = _viewers.setdefault(key, {})
                  entry = viewers.get(ip)
                  if entry is None:
                      viewers[ip] = {"first_seen": t, "last_seen": t}
                  else:
                      entry["last_seen"] = t
              ensure_resolving(ip)


      # --- mediamtx から「今上がっている配信」を取得 ---------------------------------
      def mediamtx_poller():
          url = MEDIAMTX_API + "/v3/paths/list?itemsPerPage=100"
          while True:
              try:
                  with urllib.request.urlopen(url, timeout=3) as resp:
                      data = json.load(resp)
                  t = now()
                  with _lock:
                      for item in data.get("items", []):
                          name = item.get("name")
                          if not name:
                              continue
                          if item.get("online"):
                              prev = _streams.get(name) or {}
                              online_since = item.get("onlineTime") or prev.get("online_since")
                              _streams[name] = {"online_since": online_since, "seen_at": t}
                          else:
                              _streams.pop(name, None)
              except (urllib.error.URLError, OSError, ValueError, TimeoutError) as e:
                  log("mediamtx API に届きません: {}".format(e))
              time.sleep(POLL_INTERVAL)


      # --- 掃除 (タイムアウトしたものを一覧から落とす) --------------------------------
      def prune_loop():
          while True:
              t = now()
              with _lock:
                  for key in list(_viewers.keys()):
                      viewers = _viewers[key]
                      for ip in list(viewers.keys()):
                          if t - viewers[ip]["last_seen"] > VIEWER_TIMEOUT:
                              del viewers[ip]
                      if not viewers:
                          del _viewers[key]
                  for name in list(_streams.keys()):
                      if t - _streams[name]["seen_at"] > STREAM_STALE_AFTER:
                          del _streams[name]
              time.sleep(1)


      def build_state():
          t = now()
          with _lock:
              keys = sorted(set(_streams) | set(_viewers))
              streams_out = []
              total_viewers = 0
              for key in keys:
                  info = _streams.get(key)
                  viewers_raw = _viewers.get(key, {})
                  viewers_out = []
                  for ip in sorted(viewers_raw):
                      v = viewers_raw[ip]
                      cached = _dns_cache.get(ip)
                      hostname = cached["hostname"] if cached else None
                      viewers_out.append({
                          "ip": ip,
                          "hostname": hostname,
                          "watching_seconds": int(t - v["first_seen"]),
                      })
                  total_viewers += len(viewers_out)
                  streams_out.append({
                      "key": key,
                      "online": info is not None,
                      "online_since": info["online_since"] if info else None,
                      "viewer_count": len(viewers_out),
                      "viewers": viewers_out,
                  })
          return {
              "now": t,
              "viewer_timeout_seconds": VIEWER_TIMEOUT,
              "live_count": sum(1 for s in streams_out if s["online"]),
              "total_viewers": total_viewers,
              "streams": streams_out,
          }


      # --- ダッシュボード (静的HTML + JS。fetch でポーリングして自前でDOM構築) --------
      #  逆引きホスト名は他人 (視聴者) が制御できる値です (自分のIPのPTRレコードは
      #  誰でも設定できる)。innerHTML への文字列結合では絶対に組み込まず、
      #  textContent / createElement だけで描画しています。
      DASHBOARD_HTML = """<!doctype html>
      <html lang="ja">
      <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>配信状況ダッシュボード</title>
      <style>
        :root {
          color-scheme: light dark;
          --bg: #0b0d10; --fg: #e8e8ea; --sub: #9aa0a6;
          --card: #16191d; --accent: #5b8def; --border: #262b31;
          --live: #3ecf8e; --idle: #e2a33d; --err: #e2554d;
        }
        @media (prefers-color-scheme: light) {
          :root { --bg:#f6f7f9; --fg:#1b1d21; --sub:#5a606a; --card:#fff; --border:#e2e5e9; }
        }
        * { box-sizing: border-box; }
        body {
          margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
          padding: 24px;
        }
        header { max-width: 960px; margin: 0 auto 20px; }
        h1 { font-size: 20px; margin: 0 0 4px; }
        .sub { color: var(--sub); font-size: 13px; line-height: 1.6; }
        .summary { display: flex; gap: 18px; margin-top: 12px; flex-wrap: wrap; }
        .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
                padding: 10px 16px; font-size: 13px; }
        .stat b { font-size: 18px; display: block; }
        #conn { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); }
        #conn.ok { color: var(--live); }
        #conn.error { color: var(--err); }
        main { max-width: 960px; margin: 0 auto; display: grid; gap: 14px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
        .card h2 { margin: 0 0 8px; font-size: 15px; display: flex; align-items: center; gap: 10px; }
        .badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; letter-spacing: .04em; }
        .badge.live { background: rgba(62,207,142,.15); color: var(--live); }
        .badge.idle { background: rgba(226,163,61,.15); color: var(--idle); }
        .key { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
        .count { color: var(--sub); font-size: 12px; margin: 0 0 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
        th { color: var(--sub); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
        td.ip { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
        td.muted { color: var(--sub); }
        .empty { color: var(--sub); text-align: center; padding: 40px 0; }
      </style>
      </head>
      <body>
      <header>
        <h1>配信状況ダッシュボード</h1>
        <p class="sub">
          自宅LAN内向け。1.5秒ごとに自動更新します。視聴者は一定時間 (既定8秒)
          アクセスが無いと一覧から消えます。逆引きは相手のISP/ルーターの設定次第
          なので、常に取れるとは限りません。
        </p>
        <div class="summary">
          <div class="stat"><b id="liveCount">-</b>配信中</div>
          <div class="stat"><b id="viewerCount">-</b>視聴中(合計)</div>
          <div class="stat"><b id="updated">-</b>最終更新<div><span id="conn">-</span></div></div>
        </div>
      </header>
      <main id="streams"></main>
      <script nonce="__CSP_NONCE__">
      (function () {
        "use strict";

        function pad(n) { return (n < 10 ? "0" : "") + n; }

        function formatDuration(sec) {
          sec = Math.max(0, Math.floor(sec));
          var h = Math.floor(sec / 3600);
          var m = Math.floor((sec % 3600) / 60);
          var s = sec % 60;
          return (h > 0 ? h + ":" : "") + pad(m) + ":" + pad(s);
        }

        function formatClock(epochSeconds) {
          var d = new Date(epochSeconds * 1000);
          return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
        }

        function el(tag, opts) {
          var node = document.createElement(tag);
          opts = opts || {};
          if (opts.className) node.className = opts.className;
          if (opts.text !== undefined) node.textContent = opts.text;
          return node;
        }

        function buildStreamCard(stream) {
          var card = el("div", { className: "card" });

          var h2 = el("h2");
          var badge = el("span", {
            className: "badge " + (stream.online ? "live" : "idle"),
            text: stream.online ? "LIVE" : "視聴者のみ"
          });
          var keySpan = el("span", { className: "key", text: stream.key });
          h2.appendChild(badge);
          h2.appendChild(keySpan);
          card.appendChild(h2);

          card.appendChild(el("p", {
            className: "count",
            text: "視聴中: " + stream.viewer_count + " 人"
          }));

          if (stream.viewers.length > 0) {
            var table = el("table");
            // ヘッダーは固定文字列のみで組み立てているので innerHTML でも安全。
            table.innerHTML = "<thead><tr><th>IP</th><th>逆引き</th><th>視聴時間</th></tr></thead>";
            var tbody = el("tbody");
            stream.viewers.forEach(function (v) {
              var tr = el("tr");
              tr.appendChild(el("td", { className: "ip", text: v.ip }));
              tr.appendChild(el("td", {
                className: v.hostname ? "" : "muted",
                text: v.hostname || "(解決待ち / 逆引き不可)"
              }));
              tr.appendChild(el("td", { text: formatDuration(v.watching_seconds) }));
              tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            card.appendChild(table);
          } else {
            card.appendChild(el("p", { className: "count", text: "視聴者はいません。" }));
          }

          return card;
        }

        function render(data) {
          var root = document.getElementById("streams");
          root.textContent = "";
          if (!data.streams || data.streams.length === 0) {
            root.appendChild(el("p", { className: "empty", text: "現在配信中のストリームはありません。" }));
          } else {
            data.streams.forEach(function (s) {
              root.appendChild(buildStreamCard(s));
            });
          }
          document.getElementById("liveCount").textContent = String(data.live_count);
          document.getElementById("viewerCount").textContent = String(data.total_viewers);
          document.getElementById("updated").textContent = formatClock(data.now);
        }

        function setConnState(ok) {
          var elConn = document.getElementById("conn");
          elConn.className = ok ? "ok" : "error";
          elConn.textContent = ok ? "接続中" : "接続エラー(再試行中)";
        }

        function refresh() {
          fetch("/api/state", { cache: "no-store" })
            .then(function (res) {
              if (!res.ok) throw new Error("bad status " + res.status);
              return res.json();
            })
            .then(function (data) {
              render(data);
              setConnState(true);
            })
            .catch(function () {
              setConnState(false);
            });
        }

        refresh();
        setInterval(refresh, 1500);
      })();
      </script>
      </body>
      </html>
      """


      class Handler(http.server.BaseHTTPRequestHandler):
          server_version = "vrc-stats/1"

          def log_message(self, fmt, *args):
              # ダッシュボードから1.5秒おきにポーリングされるので、毎リクエスト
              # ログすると騒がしいだけです。起動時ログやエラーは log() 側で別途出します。
              pass

          def _route(self):
              """(status, content_type, body_bytes, extra_headers) を返すだけで、
              実際に書き出すのは呼び出し側 (do_GET / do_HEAD)。"""
              if self.path == "/" or self.path == "/index.html":
                  # CSP の script-src はデフォルト (default-src 'self') のままだと
                  # 'unsafe-inline' が無いのでインライン <script> がブラウザ側で
                  # 実行そのものをブロックされる (HTMLは表示されるのにJSだけ動かない、
                  # という気付きにくい壊れ方をする)。かといって script-src に
                  # 'unsafe-inline' を足すと、逆引きホスト名などの外部由来の値を
                  # 将来どこかで誤って innerHTML に混ぜてしまった時の保険が丸ごと
                  # 消えてしまう。なのでレスポンス毎に使い捨てのnonceを発行し、
                  # ヘッダーとこの <script> タグの両方に同じ値を入れることで、
                  # 「このレスポンスが生成した、まさにこのスクリプトタグ」だけを
                  # 許可する。
                  nonce = secrets.token_hex(16)
                  html = DASHBOARD_HTML.replace("__CSP_NONCE__", nonce, 1)
                  csp = "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'nonce-{}'".format(nonce)
                  return 200, "text/html; charset=utf-8", html.encode("utf-8"), {"Content-Security-Policy": csp}
              if self.path == "/api/state":
                  body = json.dumps(build_state(), ensure_ascii=False).encode("utf-8")
                  return 200, "application/json; charset=utf-8", body, {}
              return 404, "text/plain; charset=utf-8", b"not found\n", {}

          def _send_headers(self, status, content_type, body, extra_headers):
              self.send_response(status)
              self.send_header("Content-Type", content_type)
              self.send_header("Content-Length", str(len(body)))
              self.send_header("Cache-Control", "no-store")
              self.send_header("X-Content-Type-Options", "nosniff")
              for k, v in extra_headers.items():
                  self.send_header(k, v)
              self.end_headers()

          def do_GET(self):
              status, content_type, body, extra_headers = self._route()
              self._send_headers(status, content_type, body, extra_headers)
              self.wfile.write(body)

          def do_HEAD(self):
              # ブラウザは使わないが、curl -I 等での死活確認に応えられるようにしておく。
              status, content_type, body, extra_headers = self._route()
              self._send_headers(status, content_type, body, extra_headers)


      def main():
          log("starting: http=0.0.0.0:{} (LAN向け) syslog={}:{} mediamtx_api={} viewer_timeout={}s".format(
              HTTP_PORT, SYSLOG_BIND[0], SYSLOG_BIND[1], MEDIAMTX_API, VIEWER_TIMEOUT
          ))
          threading.Thread(target=syslog_listener, daemon=True).start()
          threading.Thread(target=mediamtx_poller, daemon=True).start()
          threading.Thread(target=prune_loop, daemon=True).start()

          server = http.server.ThreadingHTTPServer(("0.0.0.0", HTTP_PORT), Handler)
          server.serve_forever()


      if __name__ == "__main__":
          main()

services:

  # OBS の送り先:  rtmp://<ホストIP>:1935/  ストリームキーは自分で決める
  # (半角英数字・ハイフン・アンダースコア、6〜32文字)。
  # RTMP 受け口と、配信キーごとの HLS 変換をこのコンテナ1つでやります。
  mediamtx:
    image: bluenviron/mediamtx:1.20.0-ffmpeg
    container_name: vrc-mediamtx
    restart: unless-stopped
    network_mode: host
    init: true          # PID 1 を docker-init に。ゾンビ回収と signal 転送のため
    volumes:
      - hls:/hls
    configs:
      - source: mediamtx_yml_20260814c
        target: /mediamtx.yml
      - source: on_available_sh_20260814c
        target: /opt/on_available.sh
    environment:
      # --- 動作モード -------------------------------------------------------
      #  copy      : 再エンコードなし。CPU ほぼ 0・遅延最小。通常はこれ。
      #  transcode : 既知の正常値 (720p30/3.5M/main/Bフレーム無し) に強制変換。
      #              切り分け専用。設定項目は意図的に持たせていません
      #              (基準が可変だと基準になりません)。
      MODE: "${MODE:-copy}"

      # --- 遅延 -------------------------------------------------------------
      #  遅延 ≒ SEG_SECONDS × 3 + 1〜2秒
      #  OBS のキーフレーム間隔と必ず一致させること。ずれると遅延が伸びます。
      SEG_SECONDS: "${SEG_SECONDS:-1}"

      # --- 安定性 -----------------------------------------------------------
      #  SEG_KEEP_EXTRA はプレイリストに載らないので、増やしても遅延は
      #  1ms も増えません。再生が不安定なとき最初に増やすのはここです。
      SEG_LIST_SIZE:  "${SEG_LIST_SIZE:-8}"
      SEG_KEEP_EXTRA: "${SEG_KEEP_EXTRA:-60}"

      # --- 入力検査 ---------------------------------------------------------
      #  配信開始のたびにキーフレーム間隔を実測します。この秒数ぶん開始が遅れます。
      #  0 で無効。設定が固まるまでは有効のままを推奨。
      GOP_CHECK_SECONDS: "${GOP_CHECK_SECONDS:-4}"
    logging: *logging

  # HLS 配信。キャッシュ制御と案内ページもここで完結。
  #
  # イメージはバージョンを固定せず stable-alpine (安定版のAlpineビルド)
  # を常に追従します。nginx の stable 系列は新機能を追加せずバグ修正・
  # セキュリティ修正のみが入るので、自動更新の対象にしても新機能起因の
  # 予期しない挙動変化が起きにくいです。mainline 系列 (latest / alpine
  # タグ) は新機能も入るぶんそのリスクが上がるので、あえて選んでいません。
  #
  # pull_policy: always が無いと、イメージタグを浮動にしても
  # docker compose up -d はローカルにある古いイメージを使い続けます
  # (`docker compose pull` を別途明示的に叩いた場合を除く)。これを
  # 付けて初めて、再デプロイのたびに実際にレジストリを見に行きます。
  nginx:
    image: nginx:stable-alpine
    pull_policy: always
    container_name: vrc-nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - hls:/hls:ro
    configs:
      - source: nginx_conf_20260814k
        target: /etc/nginx/conf.d/default.conf
      - source: landing_html_20260814c
        target: /usr/share/nginx/html/index.html
      - source: clock_html_20260814
        target: /usr/share/nginx/html/clock.html
    logging: *logging

  # 配信状況ダッシュボード。今どの配信キーが上がっていて、誰が (どのIP・
  # 逆引きホスト名で) 見ているかをリアルタイムに一覧するためだけの小さな
  # 自作サービスです (Python標準ライブラリのみ、外部パッケージへの依存なし)。
  #
  # 「上がっている配信」は上の mediamtx サービスの API (127.0.0.1:9997 に
  # 限定して有効化) に聞きに行きます。「誰が見ているか」は mediamtx では
  # 分かりません (このスタックの HLS は mediamtx ではなく nginx が tmpfs
  # から直接配っているため) — nginx のアクセスログを syslog (UDP,
  # 127.0.0.1:19514) でこのサービスへ直接送ってもらい、そこから拾って
  # います。状態はすべてメモリ上だけで、永続化はしません。詳しい設計は
  # スクリプト本体 (下の stats_py_20260814) 冒頭のコメント参照。
  #
  # LAN内向け (0.0.0.0 bind)。cloudflared のトンネルには乗せていません。
  # イメージは nginx と同じ理由でバージョン固定せず最新の3系に追従します
  # (標準ライブラリしか使っておらず、3.x内での破壊的変更のリスクが低いため)。
  stats:
    image: python:3-alpine
    pull_policy: always
    container_name: vrc-stats
    restart: unless-stopped
    network_mode: host
    configs:
      - source: stats_py_20260814
        target: /opt/stats.py
    environment:
      # alpine (musl) はロケール未設定だと標準出力が ascii にフォールバック
      # することがあり、日本語ログを print() した瞬間に UnicodeEncodeError
      # で落ちます。これで標準出力/標準エラーを常に UTF-8 に固定します。
      PYTHONUTF8: "1"
      STATS_PORT: "${STATS_PORT:-8082}"
      VIEWER_TIMEOUT_SECONDS: "${VIEWER_TIMEOUT_SECONDS:-8}"
    command: ["python3", "/opt/stats.py"]
    logging: *logging

volumes:
  # RAM ディスク。既定値だと 68 セグメント × 数百KB 程度しか載りません。
  # 全ての配信キーで共有するので、複数の部屋を同時にライブにする場合は
  # 部屋数ぶん消費が増えます。足りなくなったら driver_opts の size を
  # 上げてください。tmpfs が使えない環境なら driver_opts を丸ごと削れば
  # 通常ボリュームで動きます。
  hls:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=512m"
